name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  paper-kill-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic sensitivity model
        run: python experiments/paper_kill_test.py

